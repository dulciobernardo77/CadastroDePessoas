<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Tarefa</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f4f7f5, #e8f1eb);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }
        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .page-header h1 {
            margin: 0 0 8px;
            color: #26332a;
            font-size: 32px;
            font-weight: 700;
        }
        .page-header p {
            margin: 0;
            color: #777;
            font-size: 15px;
        }
        .details-container {
            background-color: #fff;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e9eee9;
        }
        .profile {
            text-align: center;
            margin-bottom: 30px;
        }
        .profile h2 {
            margin: 0;
            color: #26332a;
            font-size: 25px;
            font-weight: 700;
        }
        .info-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 20px;
            margin-bottom: 25px;
        }
        .info-item {
            background-color: #fafbfa;
            border: 1px solid #e1e7e2;
            border-radius: 8px;
            padding: 13px 15px;
        }
        .info-item.full {
            grid-column: 1 / -1;
        }
        .info-label {
            display: block;
            color: #4CAF50;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .info-value {
            color: #444;
            font-size: 14px;
            word-break: break-word;
        }
        .people-section {
            margin-top: 10px;
        }
        .people-section h3 {
            margin: 0 0 15px;
            color: #26332a;
            font-size: 20px;
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e1e7e2;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
        }
        th {
            padding: 12px 15px;
            text-align: left;
            background: linear-gradient(135deg, #4CAF50, #43a047);
            color: white;
            font-size: 14px;
            font-weight: 600;
        }
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e5e9e6;
            color: #555;
            font-size: 14px;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        tbody tr:hover {
            background-color: #f4f8f5;
        }
        .no-people {
            padding: 15px;
            text-align: center;
            color: #888;
            background-color: #fafbfa;
            border: 1px solid #e1e7e2;
            border-radius: 8px;
            font-size: 14px;
        }
        .back-link {
            display: block;
            width: fit-content;
            margin: 22px auto 0;
            text-decoration: none;
            color: #4CAF50;
            font-size: 14px;
            font-weight: 600;
        }
        .back-link:hover {
            color: #388e3c;
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            body { padding: 25px 15px; }
            .page-header h1 { font-size: 26px; }
            .details-container { padding: 25px 20px; border-radius: 12px; }
            .info-container { grid-template-columns: 1fr; }
            .info-item.full { grid-column: auto; }
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>Detalhes da Tarefa</h1>
        <p>Confira abaixo as informações da tarefa.</p>
    </div>

    <div class="details-container">
        <div class="profile">
            <h2 th:text="${tarefas.nomeDaTarefa}">Nome da tarefa</h2>
        </div>

        <div class="info-container">
            <div class="info-item full">
                <span class="info-label">Dificuldade</span>
                <span class="info-value" th:text="${tarefas.dificuldade}">Média</span>
            </div>
        </div>

        <div class="people-section">
            <h3>Funcionários atribuídos</h3>

            <div class="no-people" th:if="${tarefas.pessoas == null or #lists.isEmpty(tarefas.pessoas)}">
                Nenhum funcionário está fazendo esta tarefa.
            </div>

            <div class="table-container" th:if="${tarefas.pessoas != null and !#lists.isEmpty(tarefas.pessoas)}">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="pessoa : ${tarefas.pessoas}">
                        <td th:text="${pessoa.id}">1</td>
                        <td th:text="${pessoa.nome}">Pedro</td>
                        <td th:text="${pessoa.email}">pedro@email.com</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <a class="back-link" th:href="@{/tarefas/ui/lista}">← Voltar para a lista de Tarefas</a>
</body>
</html>
